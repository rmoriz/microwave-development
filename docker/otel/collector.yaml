# Collector for the `observability` compose profile.
#
# OTLP/HTTP in from the microwave service, Prometheus exposition out for the
# prometheus service, plus the collector's own metrics for the
# `otel-collector-self` scrape job. This is the reference topology the
# OpenTelemetry guide describes; it is not a production default.

receivers:
  otlp:
    protocols:
      # HTTP/protobuf only, matching the server's `http/protobuf` protocol.
      # gRPC stays off: nothing in this stack speaks it.
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    # Replaces the deprecated, default-on `add_metric_suffixes`; keeps the unit
    # and `_total` suffixes and still escapes dots to underscores.
    translation_strategy: UnderscoreEscapingWithSuffixes

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
  # Self-telemetry on :8888 for the `otel-collector-self` job, so dropped and
  # refused points and exporter errors show up as series next to the data.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
