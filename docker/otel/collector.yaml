# Collector for the `observability` compose profile.
#
# OTLP/HTTP in from the microwave service, Prometheus exposition out for the
# prometheus service. This is the reference topology the OpenTelemetry guide
# describes; it is not a production default.

receivers:
  otlp:
    protocols:
      # HTTP/protobuf only, matching the server's `http/protobuf` protocol.
      # gRPC stays off: nothing in this stack speaks it.
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    add_metric_suffixes: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
