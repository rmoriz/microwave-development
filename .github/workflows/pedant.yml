name: pedant

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pedant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pedant:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Nightly and manual only: the PR gate must pass without Ruby.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p microwave-server
      - name: Run the strict pedant tags
        env:
          PEDANT_ARTIFACTS: ${{ runner.temp }}/pedant-artifacts
        run: scripts/run-pedant.sh strict
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pedant-artifacts
          path: ${{ runner.temp }}/pedant-artifacts
          if-no-files-found: ignore
          retention-days: 14
