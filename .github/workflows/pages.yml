name: pages

# Every path that feeds the published site. The push trigger is path-filtered;
# the pull-request trigger is not, because `build site` is a required check and
# a PR that touches no website file still has to report it. The deploy guard
# keeps pull requests to a build.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request only builds, so superseded runs are wasted work; deploys from
# main stay serialized.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            website/homepage/package-lock.json
            website/docs/package-lock.json
      - name: Build the homepage
        working-directory: website/homepage
        run: |
          npm ci
          npm run check
          npm run test:content
      - name: Build the docs
        working-directory: website/docs
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p website/homepage/dist/docs
          cp -R website/docs/build/. website/homepage/dist/docs/
          touch website/homepage/dist/.nojekyll
          test -f website/homepage/dist/.nojekyll
          test -f website/homepage/dist/docs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/homepage/dist

  deploy:
    needs: build
    # A manual dispatch from a branch has no deployment record, so the
    # github-pages environment only accepts refs/heads/main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
