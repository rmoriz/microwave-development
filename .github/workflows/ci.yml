name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation-only pull requests must not pay for a full Rust build.
  # Every job that can be gated hangs off these filters; workflow edits run
  # everything so a broken condition shows up in the same PR.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      homepage: ${{ steps.filter.outputs.homepage }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'bin/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.github/workflows/**'
            homepage:
              - 'website/homepage/**'
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - 'website/docs/**'
              - '.github/workflows/**'

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: target
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  claims:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/homepage/package-lock.json
      - run: python3 -m unittest discover -s scripts/tests
      - run: python3 scripts/check-claims.py
      # Ruby's YAML parser accepts files GitHub rejects (an unavailable
      # expression context breaks the whole workflow at run time, with no job
      # to look at), so lint the workflows with the same tool locally.
      - name: Lint the workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint

  homepage:
    needs: changes
    if: needs.changes.outputs.homepage == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website/homepage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/homepage/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website/docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/docs/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
