name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  meta:
    name: release metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(scripts/release-image-tags.sh "$GITHUB_REF_NAME")"
          while IFS='=' read -r key value; do
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done <<< "$resolved"
          version="$(sed -n 's/^version=//p' <<< "$resolved")"
          workspace_version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          if [ -n "$workspace_version" ] && [ "$version" != "$workspace_version" ]; then
            echo "::warning::tag version $version differs from the workspace version $workspace_version"
          fi

  build:
    name: ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            arch: amd64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Resolve the package version
        id: deb
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The tag is the source of truth; the script shares the validation.
          raw="$GITHUB_REF_NAME"
          workspace_version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          # The tag is the source of truth; the script shares the validation.
          if version="$(DEB_VERSION="$raw" scripts/build-deb.sh --print-version 2>"$RUNNER_TEMP/deb-version.err")" && [ -n "$version" ]; then
            if [ -z "$workspace_version" ]; then
              echo "::warning::could not read the [workspace.package] version; tag version $version is not compared"
            elif [ "$version" != "$workspace_version" ]; then
              echo "::warning::tag version $version differs from the workspace version $workspace_version"
            fi
          else
            # A moving tag such as v-current carries no version. Derive one from
            # the workspace version so snapshots still ship installable packages.
            if [ -z "$workspace_version" ]; then
              echo "::warning::tag '$raw' is not a Debian version and the [workspace.package] version is unreadable (no .deb); shipping tarballs only: $(tr '\n' ' ' < "$RUNNER_TEMP/deb-version.err")"
              echo "enabled=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version="${workspace_version}+snapshot.$(date -u +%Y%m%d).g$(git rev-parse --short "$GITHUB_SHA")"
            echo "::notice::tag '$raw' is not a Debian version; packaging as $version"
          fi
          echo "enabled=1" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the binaries
        run: |
          cargo build --release --locked \
            --target "${{ matrix.triple }}" \
            -p microwave-server -p microwave-ctl-bin -p microwave-migrate-bin
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="microwave-${GITHUB_REF_NAME}-${{ matrix.target }}"
          stage="$(mktemp -d)"
          for binary in microwave-server microwave-ctl microwave-migrate; do
            install -m 0755 "target/${{ matrix.triple }}/release/$binary" "$stage/$binary"
          done
          # The alias is the same executable under another name; a symlink
          # keeps one copy of the CLI in the archive.
          ln -s microwave-ctl "$stage/chef-server-ctl"
          mkdir -p dist
          # `-9e` is xz's maximum setting; `-T0` spreads the work over the
          # runner's cores so the extreme preset stays affordable.
          tar -cf - -C "$stage" \
            microwave-server microwave-ctl chef-server-ctl microwave-migrate \
            | xz -9e -T0 -c > "dist/${name}.tar.xz"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${name}.tar.xz" > "dist/${name}.tar.xz.sha256"
          else
            shasum -a 256 "dist/${name}.tar.xz" > "dist/${name}.tar.xz.sha256"
          fi
      - name: Package the .deb
        if: steps.deb.outputs.enabled == '1'
        shell: bash
        env:
          DEB_VERSION: ${{ steps.deb.outputs.version }}
          DEB_ARCH: ${{ matrix.arch }}
          CARGO_TARGET_DIR: target/${{ matrix.triple }}
        run: |
          set -euo pipefail
          scripts/build-deb.sh --skip-build
          sha256sum dist/*.deb > "dist/microwave-server_${DEB_VERSION}_${DEB_ARCH}.deb.sha256"
      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Stage the image context
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/image-context"
          rm -rf "$context"
          mkdir -p "$context/packaging"
          for binary in microwave-server microwave-ctl microwave-migrate; do
            install -m 0755 "target/${{ matrix.triple }}/release/$binary" "$context/$binary"
          done
          install -m 0644 packaging/microwave.toml.example "$context/packaging/microwave.toml.example"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER}/microwave-server:${VERSION}-${ARCH}" >> "$GITHUB_ENV"
      - name: Build the architecture image
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker build --target release \
            --build-arg VERSION="$VERSION" \
            --build-arg REVISION="$GITHUB_SHA" \
            --build-arg CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg SOURCE="https://github.com/${GITHUB_REPOSITORY}" \
            -t "$IMAGE" \
            -f Dockerfile "$RUNNER_TEMP/image-context"
      - name: Smoke-test the image
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE" microwave-server --version
          docker run --rm "$IMAGE" microwave-ctl --version
          docker run --rm "$IMAGE" microwave-migrate --version
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = "$ARCH"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the architecture image
        run: docker push "$IMAGE"

  manifest:
    name: merge the image manifest
    needs: [meta, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # Tags are needed to keep `latest` and `X.Y` from moving backwards when
      # an older tag is re-run.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge the manifest
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          MAJOR_MINOR: ${{ needs.meta.outputs.major_minor }}
          STABLE: ${{ needs.meta.outputs.stable }}
        run: |
          set -euo pipefail
          stable_tags="$(git tag --list 'v[0-9]*' | grep -Ev -- '-' | sort -Vr)"
          highest_stable="$(printf '%s\n' "$stable_tags" | head -n1 || true)"
          highest_same_minor="$(printf '%s\n' "$stable_tags" | grep -E "^v${MAJOR_MINOR}\." | head -n1 || true)"
          mapfile -t manifest_tags < <(
            scripts/release-image-manifest-tags.sh \
              "$GITHUB_REF_NAME" "$MAJOR_MINOR" "$STABLE" \
              "$highest_stable" "$highest_same_minor"
          )
          base="ghcr.io/${GITHUB_REPOSITORY_OWNER}/microwave-server"
          args=()
          for tag in "${manifest_tags[@]}"; do
            args+=(-t "${base}:${tag}")
          done
          docker buildx imagetools create "${args[@]}" \
            "${base}:${VERSION}-amd64" "${base}:${VERSION}-arm64"

  publish:
    needs: [meta, build, manifest]
    runs-on: ubuntu-24.04
    steps:
      # `gh` resolves the repository from the checkout, not from GITHUB_REPOSITORY.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STABLE: ${{ needs.meta.outputs.stable }}
        run: |
          set -euo pipefail
          args=(--title "$GITHUB_REF_NAME" --generate-notes)
          if [ "$STABLE" != "1" ]; then
            args+=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            if [ "$STABLE" != "1" ]; then
              gh release edit "$GITHUB_REF_NAME" --prerelease
            else
              gh release edit "$GITHUB_REF_NAME" --prerelease=false
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
          fi
