name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            deb_arch: amd64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            deb_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Resolve the package version
        id: deb
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The tag is the source of truth; the script shares the validation.
          raw="$GITHUB_REF_NAME"
          if ! version="$(DEB_VERSION="$raw" scripts/build-deb.sh --print-version 2>"$RUNNER_TEMP/deb-version.err")"; then
            echo "::warning::tag '$GITHUB_REF_NAME' is not a Debian version (no .deb); shipping tarballs only: $(tr '\n' ' ' < "$RUNNER_TEMP/deb-version.err")"
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The script always prints a version on success; this covers a script
          # that exits 0 without output.
          if [ -z "$version" ]; then
            echo "::warning::tag '$GITHUB_REF_NAME' resolved to an empty version (no .deb); shipping tarballs only"
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          workspace_version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          if [ -z "$workspace_version" ]; then
            echo "::warning::could not read the [workspace.package] version; tag version $version is not compared"
          elif [ "$version" != "$workspace_version" ]; then
            echo "::warning::tag version $version differs from the workspace version $workspace_version"
          fi
          echo "enabled=1" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the binaries
        run: |
          cargo build --release --locked \
            --target "${{ matrix.triple }}" \
            -p microwave-server -p microwave-ctl-bin -p microwave-migrate-bin
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="microwave-${GITHUB_REF_NAME}-${{ matrix.target }}"
          stage="$(mktemp -d)"
          for binary in microwave-server microwave-ctl microwave-migrate; do
            install -m 0755 "target/${{ matrix.triple }}/release/$binary" "$stage/$binary"
          done
          # The alias is the same executable under another name; a symlink
          # keeps one copy of the CLI in the archive.
          ln -s microwave-ctl "$stage/chef-server-ctl"
          mkdir -p dist
          tar -czf "dist/${name}.tar.gz" -C "$stage" \
            microwave-server microwave-ctl chef-server-ctl microwave-migrate
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"
          else
            shasum -a 256 "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"
          fi
      - name: Package the .deb
        if: steps.deb.outputs.enabled == '1'
        shell: bash
        env:
          DEB_VERSION: ${{ steps.deb.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          CARGO_TARGET_DIR: target/${{ matrix.triple }}
        run: |
          set -euo pipefail
          scripts/build-deb.sh --skip-build
          sha256sum dist/*.deb > "dist/microwave-server_${DEB_VERSION}_${DEB_ARCH}.deb.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # `gh` resolves the repository from the checkout, not from GITHUB_REPOSITORY.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
