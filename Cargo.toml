[workspace]
resolver = "2"
members = [
    "crates/microwave-config",
    "crates/microwave-crypto",
    "crates/microwave-depsolver",
    "crates/microwave-store",
    "crates/microwave-store-postgres",
    "crates/microwave-authz",
    "crates/microwave-api",
    "crates/microwave-oauth",
    "crates/microwave-objectstore",
    "crates/microwave-tls",
    "crates/microwave-ctl",
    "crates/microwave-migrate",
    "crates/microwave-mail",
    "bin/microwave-server",
    "bin/microwave-ctl",
    "bin/microwave-migrate",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
rsa = { version = "0.9", features = ["sha2"] }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.23"
flate2 = "1"
bcrypt = "0.19"
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
rusqlite = { version = "0.39", features = ["bundled"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring", "macros", "json", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.14"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2"
libc = "0.2"
url = "2"
num-bigint-dig = "0.8"
tempfile = "3"
tar = "0.4"
assert_cmd = "2"
ureq = "3.5"
http = "1"
schemars = "1"
rmcp = { version = "3.8", features = ["transport-streamable-http-server"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }

# Local dev and test builds carry no debug info and keep no incremental state:
# DWARF is most of an rlib (four fifths in the biggest one) and incremental
# snapshots add gigabytes on top. Backtraces lose file and line numbers and
# lldb cannot step, and an edit rebuilds its crate from scratch instead of
# incrementally; release builds are unaffected. `CARGO_PROFILE_DEV_DEBUG=2
# cargo build` restores line numbers for one session.
[profile.dev]
debug = 0
incremental = false

# Release binaries ship in tarballs, the Debian package and the container image,
# where debug symbols are dead weight: stripping alone takes roughly a fifth off
# each binary. Thin LTO recovers most of the cross-crate inlining a single
# codegen unit would give, at a fraction of the build time.
[profile.release]
strip = "symbols"
lto = "thin"
