[workspace]
resolver = "2"
members = [
    "crates/microwave-config",
    "crates/microwave-crypto",
    "crates/microwave-store",
    "crates/microwave-authz",
    "bin/microwave-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
rsa = { version = "0.9", features = ["sha2"] }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
bcrypt = "0.17"
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
subtle = "2"
num-bigint-dig = "0.8"
tempfile = "3"
assert_cmd = "2"
