[workspace]
resolver = "2"
members = [
    "crates/microwave-config",
    "crates/microwave-crypto",
    "crates/microwave-store",
    "crates/microwave-authz",
    "crates/microwave-api",
    "crates/microwave-objectstore",
    "crates/microwave-ctl",
    "crates/microwave-migrate",
    "bin/microwave-server",
    "bin/microwave-ctl",
    "bin/microwave-migrate",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
rsa = { version = "0.9", features = ["sha2"] }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
bcrypt = "0.17"
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2"
num-bigint-dig = "0.8"
tempfile = "3"
assert_cmd = "2"
