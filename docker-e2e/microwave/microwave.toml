[server]
# Bind to the Compose service name, not 0.0.0.0. microwave-server builds the
# presigned /bookshelf URLs from this value, so the seed container and the
# Chef nodes must be able to reach it by this name.
bind = "microwave:8000"

[paths]
data_dir = "/var/lib/microwave"

[database]
driver = "sqlite"

[search]
backend = "embedded"

[object_store]
backend = "local"

[keygen]
size = 3
workers = 1
warm_up = true

[mcp]
enabled = true
# Requests from inside the Compose network carry this Host header. Without the
# entry the MCP transport rejects them with 403.
allowed_hosts = ["microwave:8000"]

[mcp.organizations.e2e]
token = "e2e-mcp-token"
principal = "pivotal"
writes = true

[data_collector]
# Keep run reports so the MCP run tools have data to return.
store = "local"
